<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kana Trainer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#141e30,#243b55);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.app{
    width:100%;
    max-width:480px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.kana{
    text-align:center;
    font-size:60px;
    margin:20px 0;
    letter-spacing:6px;
}

input{
    width:100%;
    padding:14px;
    font-size:18px;
    border:none;
    border-radius:12px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    color:white;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
}

.primary{background:#00ffcc;color:black}
.danger{background:#ff3c6f;color:white}
.settings-btn{
    background:#444;
    padding:8px 12px;
    border-radius:10px;
}

.result{
    text-align:center;
    margin-top:8px;
    min-height:24px;
}

.correct{color:#00ff88}
.incorrect{color:#ff4c4c}

/* Modal */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal-content{
    background:#1e1e2f;
    width:100%;
    max-width:500px;
    max-height:85vh;
    overflow:auto;
    border-radius:18px;
    padding:20px;
}

.symbol-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:6px;
    margin-top:10px;
}

.symbol-grid label{
    text-align:center;
    font-size:16px;
}

@media(max-width:400px){
    .kana{font-size:48px}
}
</style>
</head>
<body>

<div class="app">
<div class="card">

<div class="header">
    <div>
        <div>Score: <span id="score">0</span></div>
        <div>Tiempo: <span id="time">10</span></div>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙</button>
</div>

<div class="kana" id="kana">Presiona Iniciar</div>

<input id="input" placeholder="Escribe en romaji">

<div class="result" id="result"></div>

<div class="buttons">
    <button class="primary" onclick="iniciar()">Iniciar</button>
    <button class="danger" onclick="finalizar()">Finalizar</button>
</div>

</div>
</div>

<!-- SETTINGS MODAL -->

<div class="modal" id="modal">
<div class="modal-content">

<h3>Ajustes</h3>

<label><input type="checkbox" id="useHira" checked> Hiragana</label><br>
<label><input type="checkbox" id="useKata"> Katakana</label>

<br><br>

<label>Tiempo (5–20 seg)</label>
<input type="range" id="tiempoSlider" min="5" max="20" value="10">

<br><br>

<label><input type="checkbox" id="toggleVidas"> Activar vidas</label>
<input type="number" id="vidasInput" value="3" min="1" max="10">

<br><br>

<strong>Símbolos</strong>
<div class="symbol-grid" id="symbolGrid"></div>

<br>
<button class="primary" onclick="closeSettings()">Guardar</button>

</div>
</div>

<script>

const hira={
"あ":"a","い":"i","う":"u","え":"e","お":"o",
"か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
"さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",
"た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",
"な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",
"は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",
"ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",
"や":"ya","ゆ":"yu","よ":"yo",
"ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",
"わ":"wa","を":"wo","ん":"n"
};

const kata=Object.fromEntries(
Object.entries(hira).map(([k,v])=>[
k.replace(/[ぁ-ん]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)),v
]));

let pool=[];
let romajiCorrecto="";
let score=0;
let tiempoRestante=10;
let intervalo=null;
let juegoActivo=false;

const input=document.getElementById("input");
const kanaDisplay=document.getElementById("kana");
const result=document.getElementById("result");

input.addEventListener("input", () => {

    input.value = input.value.toLowerCase();
    if(!juegoActivo) return;

    const intento = input.value;

    // Si acierta completamente
    if(intento === romajiCorrecto){
        score++;
        document.getElementById("score").textContent = score;

        input.value = "";
        result.innerHTML = "";

        generar();
        reiniciarTimer();
        return;
    }

    // Validación parcial en tiempo real
    result.innerHTML = "";

    for(let i = 0; i < intento.length; i++){
        if(romajiCorrecto[i] === intento[i]){
            result.innerHTML += `<span class="correct">${intento[i]}</span>`;
        } else {
            result.innerHTML += `<span class="incorrect">${intento[i]}</span>`;
        }
    }
});

function construirGrid(){
    const grid=document.getElementById("symbolGrid");
    const all={...hira,...kata};
    for(let s in all){
        const label=document.createElement("label");
        label.innerHTML=`<input type="checkbox" class="symbolCheck" value="${s}" checked> ${s}`;
        grid.appendChild(label);
    }
}

function actualizarPool(){
    pool=[];
    const selected=[...document.querySelectorAll(".symbolCheck:checked")].map(c=>c.value);

    if(useHira.checked){
        for(let s of selected){
            if(hira[s]) pool.push({kana:s,valor:hira[s]});
        }
    }
    if(useKata.checked){
        for(let s of selected){
            if(kata[s]) pool.push({kana:s,valor:kata[s]});
        }
    }
}

function generar(){
    actualizarPool();
    if(pool.length===0){
        kanaDisplay.textContent="Selecciona símbolos";
        return;
    }

    input.value="";
    result.innerHTML="";

    let len=Math.floor(Math.random()*5)+4;
    let frase="";
    romajiCorrecto="";

    for(let i=0;i<len;i++){
        const r=pool[Math.floor(Math.random()*pool.length)];
        frase+=r.kana;
        romajiCorrecto+=r.valor;
    }

    kanaDisplay.textContent=frase;
}

function iniciar(){
    score=0;
    document.getElementById("score").textContent=0;
    juegoActivo=true;
    generar();
    iniciarTimer();
}

function finalizar(){
    juegoActivo=false;
    clearInterval(intervalo);
    kanaDisplay.textContent="Juego Finalizado";
}

function iniciarTimer(){
    clearInterval(intervalo);
    tiempoRestante=parseInt(tiempoSlider.value);
    document.getElementById("time").textContent=tiempoRestante;

    intervalo=setInterval(()=>{
        if(!juegoActivo) return;
        tiempoRestante--;
        document.getElementById("time").textContent=tiempoRestante;
        if(tiempoRestante<=0){
            generar();
            reiniciarTimer();
        }
    },1000);
}

function reiniciarTimer(){
    clearInterval(intervalo);
    iniciarTimer();
}

function openSettings(){
    document.getElementById("modal").style.display="flex";
}

function closeSettings(){
    guardarConfig();
    document.getElementById("modal").style.display="none";
}

function guardarConfig(){
    const selected=[...document.querySelectorAll(".symbolCheck:checked")].map(c=>c.value);

    const config={
        useHira:useHira.checked,
        useKata:useKata.checked,
        tiempo:tiempoSlider.value,
        vidas:toggleVidas.checked,
        vidasMax:vidasInput.value,
        symbols:selected
    };

    localStorage.setItem("kanaConfig",JSON.stringify(config));
}

function cargarConfig(){
    const data=localStorage.getItem("kanaConfig");
    if(!data) return;
    const config=JSON.parse(data);

    useHira.checked=config.useHira;
    useKata.checked=config.useKata;
    tiempoSlider.value=config.tiempo;
    toggleVidas.checked=config.vidas;
    vidasInput.value=config.vidasMax;

    setTimeout(()=>{
        document.querySelectorAll(".symbolCheck").forEach(c=>{
            c.checked=config.symbols.includes(c.value);
        });
    },50);
}

construirGrid();
cargarConfig();

</script>
</body>
</html>
